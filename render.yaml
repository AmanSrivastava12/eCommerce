services:
  - type: web
    name: shopwave-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      # @nestjs/config v12 etc. are ESM-only; require(esm) needs Node >= 22.12
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: shopwave-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: shopwave-redis
          property: port

  - type: keyvalue
    name: shopwave-redis
    plan: free
    region: singapore
    # Empty allow list = reachable only from Render's private network (no auth needed)
    ipAllowList: []
    # BullMQ requires keys never be evicted
    maxmemoryPolicy: noeviction
